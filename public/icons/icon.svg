<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3a55c8"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1335"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Midnight backdrop -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Constellation: scattered stars with subtle connecting lines -->
  <g stroke="#fff8e7" stroke-width="0.8" opacity="0.18" fill="none">
    <line x1="100" y1="120" x2="180" y2="180"/>
    <line x1="180" y1="180" x2="120" y2="260"/>
    <line x1="380" y1="140" x2="420" y2="220"/>
    <line x1="420" y1="220" x2="380" y2="320"/>
    <line x1="380" y1="320" x2="430" y2="400"/>
  </g>
  <g fill="#fff8e7">
    <circle cx="100" cy="120" r="2.5" opacity="0.85"/>
    <circle cx="180" cy="180" r="3" opacity="0.95"/>
    <circle cx="120" cy="260" r="2" opacity="0.7"/>
    <circle cx="380" cy="140" r="2.5" opacity="0.85"/>
    <circle cx="420" cy="220" r="3" opacity="0.95"/>
    <circle cx="380" cy="320" r="2" opacity="0.75"/>
    <circle cx="430" cy="400" r="2.5" opacity="0.85"/>
    <circle cx="80" cy="400" r="1.8" opacity="0.6"/>
    <circle cx="450" cy="80" r="1.8" opacity="0.65"/>
    <circle cx="60" cy="200" r="1.5" opacity="0.55"/>
  </g>

  <!-- Central supernova: amber halo + 4-pointed star -->
  <g transform="translate(256 256)">
    <circle r="180" fill="url(#halo)"/>
    <g fill="#fff8e7">
      <path d="M0 -100 L18 -18 L100 0 L18 18 L0 100 L-18 18 L-100 0 L-18 -18 Z"/>
    </g>
    <!-- Inner glint -->
    <circle r="14" fill="#fff" opacity="0.9"/>
  </g>
</svg>
